name: CI

on:
  push:
    branches: [main]
  pull_request:

# Seluruh perintah dijalankan dari dalam folder aplikasi Laravel.
defaults:
  run:
    working-directory: app

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Lock mengunci Symfony 8.x yang mensyaratkan php >= 8.4.1,
        # sehingga 8.3 tidak akan pernah lolos composer install.
        php: ['8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, zip, fileinfo
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('app/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Test memakai SQLite in-memory (lihat phpunit.xml), jadi tidak perlu
      # menyiapkan MySQL. Migrasi + seeder dijalankan lewat RefreshDatabase.
      - name: Run tests
        run: php artisan test

  build-assets:
    name: Build assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      # `vite build` adalah satu-satunya pemeriksa JSX/import di proyek ini
      # (tidak ada ESLint), jadi kegagalan kompilasi harus menghentikan CI.
      - name: Build frontend
        run: npm run build
